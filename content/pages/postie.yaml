# Postie landing page (/postie)
# Rewritten Sept 2026 against the Tone of Voice Guide: first-person proof, an
# analogy the reader has lived, and a named mechanism (the job changes from
# writing to editing). The spine is: problem → the three doors that close →
# the fourth door → how it runs → proof of the machinery → fit → ask.
# No prices anywhere (standing site rule).

meta:
  title: "Postie | Finished LinkedIn posts in your inbox every week"
  description: "Postie writes your LinkedIn first draft. Finished posts, researched on your topics and written in your voice, land in your inbox every week. You edit for ten minutes and publish."

hero:
  eyebrow: "Postie"
  title: "Your LinkedIn problem is a first draft problem."
  subhead:
    - "You are not short of things to say. You say them every week on calls, in proposals, in the answer you have now given four clients in a row. The trouble starts at the empty page, when saying it well is suddenly a different job."
    - "Postie starts for you. Every week, finished posts on your themes, written in your voice, arrive in your inbox. You read them with your coffee, change the lines you would have put differently, and publish."
  cta_text: "Ask about a subscription"
  cta_note: "I run this myself, so seats are limited. One client per niche."
  strip:
    - "Ten minutes a week"
    - "Nothing posted for you"
    - "Monthly, no lock-in"

problem:
  eyebrow: "The real problem"
  title: "Nobody stops posting for want of ideas."
  body:
    - "Think about the last proposal one of your people sent you to review. You read it, marked the three sentences that were wrong, sharpened the opening and sent it back inside ten minutes. You may even have enjoyed it. Now think about writing that same proposal from nothing on a Tuesday morning. Same document, entirely different amount of will required."
    - "A LinkedIn post is the second job, and that is the real reason your posting is patchy. It is not discipline and it is not a missing content strategy. Having an opinion and starting from an empty page are two separate skills, and only one of them is in short supply."
    - "So the week goes, and you tell yourself you will do it properly at the weekend. The weekend has its own plans. Meanwhile the people who were beginning to recognise your name stop seeing it, and the next time they need someone who does what you do, they think of a firm with worse answers and a steadier habit."
  pull_quote: "Editing is a ten minute job you can do while tired. Starting is not."

alternatives:
  eyebrow: "What you have already tried"
  title: "Three doors, and why each one closes."
  items:
    - label: "Door one"
      title: "The AI tool"
      body: "ChatGPT will hand you a post in seconds. But you still have to decide what the post is about, which was the hard half of the work, and what comes back is the same LinkedIn voice everyone else is pasting in. It also has no memory of what you published last month, so sooner or later it returns an idea you have already used, wearing new words. Your readers spot that before you do."
    - label: "Door two"
      title: "The writer you hire"
      body: "You brief them for an hour and get back something smooth and weightless that could have been written about any firm in your category. In a sense it was. They have never sat in one of your client calls, so the opinions are borrowed and the sentences hedge in exactly the places where you would commit."
    - label: "Door three"
      title: "Waiting to feel like it"
      body: "Some weeks the mood turns up and you write three good posts in an evening. Then a project lands and it goes quiet for a month. LinkedIn only pays out on consistency held over months, and the mood is precisely the input you cannot put in a calendar."
  answer_eyebrow: "The fourth door"
  answer_title: "Change the job, not your willpower."
  answer_body:
    - "Every one of those three asks you to supply something you have already proved you will not reliably supply: the starting effort, the brief, or the mood. Postie asks for none of them. It changes what the task is."
    - "A finished draft is sitting in your inbox on the same days each week. The work left in front of you is reading and correcting, which is the job you are good at and can do without motivation, tired, on a Monday morning, with a coffee. That is the entire mechanism, and it is why it survives a busy month when the other three do not."

how_it_works:
  eyebrow: "How it runs"
  title: "An hour to set up. Then it just runs."
  steps:
    - title: "You give me an hour."
      body: "We go through who you sell to, the handful of themes you want your name attached to, and what you actually believe about each one. You send me a few things you have written that sound like you. That becomes your voice profile, and everything Postie writes afterwards is measured against it."
    - title: "Postie researches and drafts, weekly."
      body: "It reads what is being discussed in your field that week, checks every candidate idea against everything it has already written for you, and drafts the posts. Each draft is measured for length, tone and the tics that make writing sound automated, before it is allowed anywhere near your inbox."
    - title: "The posts arrive on fixed days."
      body: "Read, edit, publish. Skip one and that topic goes back in the queue for later. If a post misses the mark, tell me and I change the instructions behind your account, which is the part you cannot get from a tool."

what_you_get:
  eyebrow: "What lands in your inbox"
  title: "Finished work, not raw material."
  items:
    - title: "Complete posts on a fixed weekly schedule."
      body: "Not outlines, not prompts, not three bullets to expand. Posts you could publish unedited, though you probably will not, and should not."
    - title: "An image with every post."
      body: "Made for that post, not pulled off a stock library where your competitor found the same photograph."
    - title: "Topics researched fresh each week."
      body: "Drawn from what your field is actually discussing now, rather than recycled out of a fixed idea bank that goes stale by month two."
    - title: "A long-form article as a Word document."
      body: "On the higher plan, weekly. Yours to publish as a newsletter, a blog post or a client mailer, and it arrives with a companion post that points at it."
    - title: "A calendar of what is coming."
      body: "So you can see the month ahead and move things around before they are written, not after."
    - title: "Me, on email."
      body: "You are not filing a ticket with a support queue. You are telling the person who built the thing what it got wrong, and he changes it."

engineering:
  eyebrow: "Why it does not read like AI"
  title: "The dull machinery is the actual product."
  intro:
    - "I have been automating my own work since 2006, when the first thing I did was repurpose the Caps Lock key into a search bar. Twenty years of that teaches you one lesson: the first version of anything automated is easy, and the fiftieth is the one that exposes you."
    - "Anyone can get a language model to write a LinkedIn post. Getting it to write fifty across a year without sliding into repetition, sameness and tells is a different problem. Most of Postie is the boring machinery that stops that happening."
  points:
    - title: "It will not repeat itself."
      body: "Three separate checks run before a topic is accepted, including one that catches the same idea coming back in new clothes. The reworded repeat is the failure everybody else ships."
    - title: "It rotates your themes on purpose."
      body: "You set the weight each theme carries. Two posts a week on the thing that wins you work and one on the thing that builds credibility, week after week, instead of whatever the model found interesting that morning."
    - title: "It writes in your voice, not the LinkedIn voice."
      body: "No hashtags. No one line per sentence stacking. No opening with \"Here's the thing:\". These are rules in code, not polite requests in a prompt, which is why they hold on every post rather than most of them."
    - title: "It never bolts on a templated closer."
      body: "No \"What do you think? Let me know below\" at the bottom of every post. That closer is the fastest way to look automated, and it is the first thing readers learn to skip."
    - title: "Nothing broken reaches you."
      body: "A draft that comes out wrong is caught and rewritten inside the system. You see the ones that passed."

fit:
  eyebrow: "Fit"
  title: "This works if you sell on expertise."
  for_title: "A good fit if you are"
  for_items:
    - "A consultant, advisor or professional services owner whose next client is somebody who already trusts your judgement."
    - "A founder or partner who knows LinkedIn matters and has proved to yourself, repeatedly, that you will not sit down and write."
    - "Someone with real opinions about your market who has no interest in handing them to a writer who does not hold them."
    - "Willing to spend ten minutes a week editing. That part cannot be removed, and you would not want it removed."
  not_for_title: "Not a good fit if you"
  not_for_items:
    - "Want follower growth, viral hooks or engagement pods. Postie writes to be read by the few hundred people who could actually hire you."
    - "Want to publish without reading first. It is a first draft service, and a first draft is meant to be read."
    - "Want a full ghostwriting relationship with strategy calls and revision rounds. That is a good thing to buy. It is not this."

plans:
  eyebrow: "Plans"
  title: "Two plans, both monthly."
  items:
    - name: "Posts"
      description: "Finished LinkedIn posts every week, with images, on a fixed schedule."
      includes:
        - "Weekly posts, in your voice"
        - "An image with every post"
        - "Calendar of upcoming topics"
    - name: "Posts and article"
      description: "Everything in Posts, plus a long-form article every week as a Word document, with a companion post."
      includes:
        - "Everything in Posts"
        - "A weekly article as a Word document"
        - "A companion post that points at it"
  note: "No annual lock-in. Onboarding is a one time session included in your first month. Engagements are scoped in the conversation, not off a price list."

faq:
  eyebrow: "Before you ask"
  title: "The questions I get every time."
  items:
    - question: "Does it post to LinkedIn for me?"
      answer: "No. Everything arrives by email and you publish it yourself. I do not ask for your login, and Postie has no access to your account. The last word stays yours, every time."
    - question: "What if I do not like a post?"
      answer: "Edit it, which is the expected use, or skip it and the topic returns to the queue. If posts keep missing in the same way, email me and I change the instructions behind your account. That correction loop is as much of what you are paying for as the posts."
    - question: "Will it sound like me?"
      answer: "It is trained on writing you supply and it improves over the first few weeks as you edit. Expect week one to need more work than week four. If it is not close by week three, tell me, because that is a fixable problem and not a you problem."
    - question: "How long does onboarding take?"
      answer: "About an hour of your time. Posts start the following week."
    - question: "Can I pause it?"
      answer: "Yes. Tell me and delivery stops. Your themes and voice profile are kept, so starting again takes an email."
    - question: "Do you work with my competitors?"
      answer: "No. One client per niche per market. That is most of why seats are limited."
    - question: "Who actually runs this?"
      answer: "I do. I built it, I run it, and I read what goes out. It is not a reseller account on somebody else's tool."

final:
  title: "Stop negotiating with a blank page."
  body:
    - "Tell me what you do and who you are trying to reach. If Postie is a fit, I will write you a week of posts before you commit to anything, so you can read your own voice coming back at you and judge it properly."
  form_heading: "Ask about a subscription"
  form_note: "I read and reply to these myself, usually within a working day."
