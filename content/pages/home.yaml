# Homepage Content: "Your sales problem is usually a marketing problem."
# Last updated: 2026-08-15 (consulting-first repositioning)

meta:
  title: "Anoop Kurup: Marketing Consultant for B2B Services"
  description: "Marketing consultant for B2B services businesses. I fix the marketing behind weak sales: positioning, visibility, and lead generation that produces a pipeline you can predict."

hero:
  headline: "Your sales problem is usually a marketing problem."
  body:
    - "A thin pipeline. Prospects who can't tell you apart from the next firm. A brand nobody has heard of outside your referral circle. These look like sales problems, and they are; but they start upstream, in marketing that was never built."
    - "I'm a marketing consultant for B2B services businesses. I fix the positioning, the visibility, and the lead generation behind weak sales, so your pipeline stops depending on luck."
  cta_text: "Get in touch"
  cta_link: "/contact"
  cta_note: "Tell me what's going on. I read and reply to every message myself."

sound_familiar:
  section_title: "Sound familiar?"
  items:
    - symptom: "Nobody's heard of you outside your referral circle."
      reframe: "Your best work is invisible. Prospects can't buy from a firm they've never come across, so every new client has to arrive pre-sold by someone else. That's not a sales weakness; it's absent visibility, and visibility can be built deliberately."
    - symptom: "Prospects can't tell you apart from the next firm."
      reframe: "When your website and your pitch say what every competitor says, the only lever left is price. That's a positioning problem: the market hasn't been given a reason to choose you, so it chooses the cheapest."
    - symptom: "Marketing happens in bursts, then stops."
      reframe: "A post here, a campaign there, silence whenever delivery gets busy. Tactics without a strategy behind them produce activity, not pipeline. The fix is a smaller set of things done every week, not more things done occasionally."
    - symptom: "Leads arrive, then quietly disappear."
      reframe: "Most firms don't lose deals in the meeting; they lose them in the gap after it, because no system owns what happens next. Interest without follow-up is rent paid on a shop that's never open."

how_i_fix_it:
  section_title: "How I fix it"
  stages:
    - number: "1"
      name: "Package"
      description: "We work out who you serve and why you, then extract the skill your best clients actually paid for and shape it into one offer with a clear outcome. Positioning first: a sellable unit a stranger can understand in one sentence."
    - number: "2"
      name: "Prove & Sell"
      description: "We put the offer in front of real prospects and refine it against what they actually say. I'm in the room with you. Warm contacts first, then a cold channel I build so you don't run out of names. The market decides the final shape of the offer."
    - number: "3"
      name: "Systemise"
      description: "What survived the market becomes your marketing system: the words that got replies, the weekly rhythm of visibility and outreach, the scripts and checklists. Written down. Run at least once already. Yours to keep."

