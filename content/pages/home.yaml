qualification:
  section_title: "Who this is for, and who it isn't"
  for_you:
    heading: "It's for you if…"
    items:
      - "You run a B2B services firm in India: consulting, agency, training, or professional services."
      - "You're mostly out of day-to-day delivery: your team or your systems handle the work, so your time can go into growth."
      - "New business still depends on your network and your personal selling, and you can feel that ceiling."
      - "You want a working pipeline, not another marketing experiment."
  not_for_you:
    heading: "It's not for you if…"
    items:
      - "You're still hands-on in most client delivery. Fix capacity first; a marketing system competes with billable hours you can't spare."
      - "You want an agency to run your ads and post your content. I consult, build the system, and train your team to run it."
      - "You're looking for hacks. This is a system, built deliberately, that you have to run."

