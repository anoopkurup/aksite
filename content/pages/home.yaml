# Homepage Content: "Your sales problem is usually a marketing problem."
# Last updated: 2026-08-24 (thought-leader repositioning: ideas first, India explicit)

meta:
  title: "Anoop Kurup | Marketing Consultant for B2B Service Firms in India"
  description: "Marketing consultant for B2B service firms in India. I write about, and fix, the growth problems behind weak sales: getting clients beyond referrals, positioning and pricing, and scaling beyond the founder."

hero:
  headline: "Your sales problem is usually a marketing problem."
  body:
    - "A thin pipeline. Prospects who can't tell you apart from the next firm. A brand nobody has heard of outside your referral circle. These look like sales problems, and they are; but they start upstream, in marketing that was never built."
    - "I'm a marketing consultant for B2B service firms in India: consulting, agency, training, and professional-services businesses that have outgrown referrals but not yet built the marketing to replace them. I write about that problem here, and I fix it in a handful of engagements a year."
  cta_text: "Get in touch"
  cta_link: "/contact"
  cta_note: "Tell me what's going on. I read and reply to every message myself."

argument:
  section_title: "Why good firms stall"
  paragraphs:
    - "Most B2B service firms in India grow on referrals for the first few years, and referrals are wonderful right up to the point where they stop. They arrive when a past client happens to be asked, not when you need them. A firm built on them has a pipeline it cannot switch on, and a founder who is the only person who can sell."
    - "The usual response is more tactics: a website refresh, a burst of LinkedIn posts, an agency running ads. They rarely work, because the problem sits upstream. Prospects cannot tell the firm apart from the next one, the offer cannot be explained in one sentence, and there is no reason to choose it beyond who recommended it. Marketing built on that foundation produces activity, not enquiries."
    - "Fix the positioning, then the offer, then the weekly rhythm that keeps the firm visible to the right buyers, and sales stops being a mystery. That is the whole argument. The writing below works through it one problem at a time."

how_i_fix_it:
  section_title: "How I fix it"
  link_text: "See how an engagement works"
  link: "/clear"
  stages:
    - number: "1"
      name: "Package"
      description: "We work out who you serve and why you, then extract the skill your best clients actually paid for and shape it into one offer with a clear outcome. Positioning first: a sellable unit a stranger can understand in one sentence."
    - number: "2"
      name: "Prove & Sell"
      description: "We put the offer in front of real prospects and refine it against what they actually say. I'm in the room with you. Warm contacts first, then a cold channel I build so you don't run out of names. The market decides the final shape of the offer."
    - number: "3"
      name: "Systemise"
      description: "What survived the market becomes your marketing system: the words that got replies, the weekly rhythm of visibility and outreach, the scripts and checklists. Written down. Run at least once already. Yours to keep."

